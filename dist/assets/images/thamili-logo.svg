<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 85" width="240" height="85">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mascot Robot Icon -->
  <g transform="translate(10, 8)">
    <!-- Temple Gopuram Outline Behind Robot -->
    <path d="M 45 42 L 52 18 L 56 18 L 57 14 L 63 14 L 64 18 L 68 18 L 75 42 Z" fill="#1e3a8a" opacity="0.6"/>
    <rect x="54" y="9" width="12" height="5" rx="1" fill="#38bdf8" opacity="0.7"/>
    <line x1="60" y1="4" x2="60" y2="9" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="3" r="2" fill="#67e8f9"/>
    
    <!-- Robot Head Base -->
    <ellipse cx="32" cy="34" rx="26" ry="24" fill="url(#blueGlow)" filter="url(#glow)"/>
    <!-- Head Outline / Shell -->
    <ellipse cx="32" cy="33" rx="24" ry="21" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Face Screen -->
    <rect x="15" y="19" width="34" height="24" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Glowing Cyan Smiling Eyes -->
    <path d="M 20 28 Q 25 22 29 28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 35 28 Q 39 22 43 28" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Glowing Smile -->
    <path d="M 26 36 Q 32 41 38 36" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Robot Ears / Antennas -->
    <circle cx="6" cy="32" r="5" fill="#38bdf8"/>
    <circle cx="6" cy="32" r="2.5" fill="#ffffff"/>
    <circle cx="58" cy="32" r="5" fill="#38bdf8"/>
    <circle cx="58" cy="32" r="2.5" fill="#ffffff"/>

    <path d="M 18 12 L 13 4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="12" cy="3" r="3" fill="#67e8f9"/>
    <path d="M 46 12 L 51 4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="52" cy="3" r="3" fill="#67e8f9"/>

    <!-- Small Leaves Decor -->
    <path d="M 68 30 C 72 20, 84 22, 82 34 C 76 36, 70 34, 68 30 Z" fill="url(#leafGrad)"/>
    <path d="M 72 40 C 78 35, 88 40, 84 48 C 77 48, 73 45, 72 40 Z" fill="url(#leafGrad)"/>
  </g>

  <!-- Typography Brand -->
  <g transform="translate(86, 12)">
    <!-- Tamil Script "தமிழி" -->
    <text x="0" y="38" font-family="'Mukta Malar', 'Noto Sans Tamil', 'Latha', 'Tamil Sangam MN', sans-serif" font-weight="900" font-size="34" fill="url(#textGrad)" letter-spacing="1">தமிழி</text>
    
    <!-- English Subtext "THAMILI" -->
    <line x1="2" y1="52" x2="28" y2="52" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <text x="34" y="55" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" fill="#93c5fd" letter-spacing="4">THAMILI</text>
    <line x1="88" y1="52" x2="114" y2="52" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
